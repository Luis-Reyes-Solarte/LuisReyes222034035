<div class="p-fluid">
    <form [formGroup]="userForm3" (ngSubmit)="onsubmit()">
        <div class="field">
            <label for="dni">Numero de identificacion: </label>
            <i class="pi pi-id-card"></i>
            <input id="dni" type="text" pInputText formControlName="dni" class="w-full"/>
            <div *ngIf="userForm3.controls['dni'].invalid && userForm3.controls['dni'].touched" class="error">
                La identificacion es requerido
            </div>
        </div>

        <div class="f1">

            <div class="field">
                <label for="calendario1">Fecha de inicio: </label>
                <i class="pi pi-calendar-clock"></i>
                <p-calendar id="calendario1" 
                formControlName="calendario1"
                [showIcon]="true" 
                [showOnFocus]="false" 
                inputId="buttondisplay"
            />
                <div *ngIf="userForm3.controls['calendario1'].invalid && userForm3.controls['calendario1'].touched" class="error">
                    La fecha de inicio es requerida
                </div>
            </div>

            <div class="field">
                <label for="calendario2">Fecha fin: </label>
                <i class="pi pi-calendar-minus"></i>
                <p-calendar id="c2" 
                formControlName="calendario2"
                [showIcon]="true" 
                [showOnFocus]="false" 
                inputId="buttondisplay"
            />
                <div *ngIf="userForm3.controls['calendario2'].invalid && userForm3.controls['calendario2'].touched" class="error">
                    La fecha de fin es requerida
                </div>
            </div>
        </div>
        <button 
        pButton
        type="submit"
        class="w-full"
        label="Terminado"
        icon="pi pi-flag"
        iconPos="right"
        [disabled]="userForm3.invalid"
    ></button>
    </form>
</div>
