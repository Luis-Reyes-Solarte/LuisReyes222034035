<div class="p-fluid">
    <form [formGroup]="userForm">

        <div class="p-field">
            <label for="nombre">Primer nombre</label>
            <input id="nombre" type="text" pInputText formControlName="nombre"/>
            <div *ngIf="userForm.controls['nombre'].invalid && userForm.controls['nombre'].touched" class="error">
                El nombre es requerido
            </div>
        </div>

        <div class="p-field">
            <label for="apellido">Primer apellido</label>
            <input id="apellido" type="text" pInputText formControlName="apellido"/>
            <div *ngIf="userForm.controls['apellido'].invalid && userForm.controls['apellido'].touched" class="error">
                El apellido es requerido
            </div>
        </div>

        <div class="p-field">
            <label for="email">Correo Electrónico</label>
            <input id="email" type="text" pInputText formControlName="email"/>
            <div *ngIf="userForm.controls['email'].invalid && userForm.controls['email'].touched" class="error">
                El Correo es requerido
            </div>
        </div>
    </form>
</div>
